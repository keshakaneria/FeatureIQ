[build]
  command = "npm install --prefix server && npm run build --prefix client"
  publish = "client/dist"

[functions]
  directory = "server/src"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/index/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
